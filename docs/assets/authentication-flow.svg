<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1180" viewBox="0 0 1250 1180" role="img" aria-labelledby="title desc">
  <title id="title">Edutex authentication sequence</title>
  <desc id="desc">Seven ordered steps show the authorization-code flow from a browser start through one-time PKCE state, Cognito or school identity verification, token checks, PostgreSQL role reconciliation and an opaque device session.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#008F8C"/>
    </marker>
    <style>
      .box { fill:#F3F7FA; stroke:#15395B; stroke-width:3; rx:18; }
      .accent { fill:#E5F5F3; }
      .n { fill:#008F8C; font:700 30px 'DejaVu Sans', sans-serif; text-anchor:middle; }
      .label { fill:#1A2733; font:600 25px 'DejaVu Sans', sans-serif; text-anchor:middle; }
      .sub { fill:#5D6B78; font:400 21px 'DejaVu Sans', sans-serif; text-anchor:middle; }
      .flow { stroke:#008F8C; stroke-width:5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1250" height="1180" fill="white"/>

  <rect class="box" x="160" y="35" width="930" height="115"/>
  <text class="n" x="225" y="104">1</text><text class="label" x="650" y="82">Browser starts an enabled method</text><text class="sub" x="650" y="118">exact hostname and school policy</text>
  <path class="flow" d="M625 150 L625 195"/>

  <rect class="box accent" x="160" y="200" width="930" height="125"/>
  <text class="n" x="225" y="275">2</text><text class="label" x="650" y="250">BFF stores one-time transaction material</text><text class="sub" x="650" y="289">PKCE · state · nonce · browser-binding hashes · five-minute TTL</text>
  <path class="flow" d="M625 325 L625 370"/>

  <rect class="box" x="160" y="375" width="930" height="125"/>
  <text class="n" x="225" y="450">3</text><text class="label" x="650" y="425">Cognito / school IdP verifies identity</text><text class="sub" x="650" y="464">password + TOTP · user-verified passkey · external SSO</text>
  <path class="flow" d="M625 500 L625 545"/>

  <rect class="box" x="160" y="550" width="930" height="115"/>
  <text class="n" x="225" y="619">4</text><text class="label" x="650" y="597">Browser returns one-time code + state</text><text class="sub" x="650" y="633">same browser-binding cookie</text>
  <path class="flow" d="M625 665 L625 710"/>

  <rect class="box accent" x="160" y="715" width="930" height="130"/>
  <text class="n" x="225" y="793">5</text><text class="label" x="650" y="765">BFF exchanges and verifies the code</text><text class="sub" x="650" y="806">signature · issuer · audience · time · nonce · single use</text>
  <path class="flow" d="M625 845 L625 890"/>

  <rect class="box" x="160" y="895" width="930" height="125"/>
  <text class="n" x="225" y="970">6</text><text class="label" x="650" y="945">PostgreSQL resolves tenant and identity</text><text class="sub" x="650" y="984">current provider claims reconcile directory-managed roles</text>
  <path class="flow" d="M625 1020 L625 1065"/>

  <rect class="box accent" x="160" y="1070" width="930" height="95"/>
  <text class="n" x="225" y="1130">7</text><text class="label" x="650" y="1112">BFF issues opaque device session</text><text class="sub" x="650" y="1145">Cognito tokens are discarded</text>
</svg>
